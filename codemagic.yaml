workflows:
  android-debug:
    name: OSINT Desk debug
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
